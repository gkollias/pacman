<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacman</title>
<style>
  :root { --bg: #05050f; --fg: #e8e8f0; --muted: #9a9ab0; --accent: #ffe500; --maze: #5454f2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
         padding: 16px; gap: 12px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 0.08em; color: var(--accent); }
  .stage { position: relative; width: min(100%, 800px, calc((100vh - 170px) * 4 / 3));
           aspect-ratio: 4 / 3; border: 2px solid var(--maze); border-radius: 6px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; background: #000; outline: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 8px; background: rgba(5, 5, 15, 0.85); cursor: pointer;
             text-align: center; padding: 16px; }
  #overlay strong { font-size: 22px; color: var(--accent); }
  #overlay[hidden] { display: none; }
  .help { color: var(--muted); max-width: 800px; text-align: center; }
  kbd { border: 1px solid var(--muted); border-radius: 3px; padding: 0 4px; color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>PACMAN</h1>
  <div class="stage">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="overlay"><strong id="status">Loading…</strong><span id="hint"></span></div>
  </div>
  <p class="help">
    <kbd>1</kbd>–<kbd>3</kbd> or arrows + <kbd>Enter</kbd> in menus ·
    arrows to move · <kbd>P</kbd> pause · <kbd>Esc</kbd> back to the menu<br>
    Single player. For LAN games with friends, get the Mac app from
    <a href="https://github.com/gkollias/pacman/releases" style="color: var(--maze)">the releases page</a>.
  </p>
</main>
<script>
  var canvas = document.getElementById('canvas');
  var overlay = document.getElementById('overlay');
  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var ready = false;

  /* Keep arrow keys and Space from scrolling the page. */
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
  }, { passive: false });

  /* A click focuses the game and lets the browser start its sound. */
  overlay.addEventListener('click', function () {
    if (!ready) return;
    overlay.hidden = true;
    canvas.focus();
  });
  canvas.addEventListener('blur', function () {
    if (ready) { statusEl.textContent = 'Paused focus'; hintEl.textContent = 'Click to keep playing'; overlay.hidden = false; }
  });

  var Module = {
    canvas: canvas,
    setStatus: function (text) {
      if (ready) return;
      var m = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
      statusEl.textContent = m ? 'Loading… ' + Math.round(100 * m[1] / m[3]) + '%' : (text || 'Starting…');
    },
    onRuntimeInitialized: function () {
      ready = true;
      statusEl.textContent = 'Click to play';
      hintEl.textContent = 'Sound starts when you click';
    },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); }
  };
  window.onerror = function () { statusEl.textContent = 'Something went wrong — see the console'; overlay.hidden = false; };
</script>
{{{ SCRIPT }}}
</body>
</html>
